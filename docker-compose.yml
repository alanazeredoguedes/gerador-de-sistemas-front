version: "3.7"

services:

    app:
      build:
        context: ./docker/node
        dockerfile: Dockerfile
      image: app-node
      container_name: app-gerador-de-sistemas-front
      #command:
      #  - "npm run dev"
      expose:
        - "3000"
      ports:
        - "9000:3000"
      working_dir: /home/node/app
      volumes:
        - ./:/home/node/app
      networks:
        - project-network
      tty: true


